pre-commit:
  parallel: true
  jobs:
    - name: ruff check
      root: engine/
      glob: "*.py"
      run: uv run ruff check --force-exclude {staged_files}
    - name: ruff format
      root: engine/
      glob: "*.py"
      run: uv run ruff format --check --force-exclude {staged_files}
    - name: pyright
      root: engine/
      glob: "engine/src/**/*.py"
      run: uv run pyright {staged_files}
    - name: biome
      glob: "*.{ts,tsx}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}

pre-push:
  jobs:
    - name: guard push
      # {files} is deliberate: without it, lefthook skips this job when a push
      # has no changed files, such as a branch deletion. The script ignores it.
      run: uv run --no-project scripts/guard_push.py {files}
      use_stdin: true
      files: git ls-files lefthook.yml
