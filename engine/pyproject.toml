[project]
name = "localflow-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dev Mirpuri", email = "149519587+dev-mirpuri@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
localflow-engine = "localflow_engine:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not gpu'"
asyncio_default_fixture_loop_scope = "function"
markers = ["gpu: needs a CUDA GPU; deselected unless run with -m gpu"]
