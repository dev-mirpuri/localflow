[project]
name = "localflow-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dev Mirpuri", email = "149519587+dev-mirpuri@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    # The newest nvidia-cublas (13.8.2.x) has no Windows wheel; this is the last one that does.
    "nvidia-cublas==13.8.0.4",
    "onnx-asr[gpu,hub]==0.12.0",
    "onnxruntime-gpu[cuda,cudnn]==1.31.1",
]

[project.scripts]
localflow-engine = "localflow_engine:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not gpu and not windows'"
markers = [
    "gpu: needs a CUDA GPU; deselected unless run with -m gpu",
    "windows: needs real Windows input; deselected unless run with -m windows",
]
