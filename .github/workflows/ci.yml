name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: uv sync
        working-directory: engine
        run: uv sync --locked
      - name: ruff check
        working-directory: engine
        run: uv run ruff check .
      - name: ruff format
        working-directory: engine
        run: uv run ruff format --check .
      - name: pyright
        working-directory: engine
        run: uv run pyright
      - name: pytest
        working-directory: engine
        run: uv run pytest -m "not gpu"

      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: biome ci
        run: pnpm exec biome ci --no-errors-on-unmatched .
