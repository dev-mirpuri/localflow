name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: uv sync
        working-directory: engine
        run: uv sync --locked
      - name: ruff check
        working-directory: engine
        run: uv run ruff check .
      - name: ruff format
        working-directory: engine
        run: uv run ruff format --check .
      - name: pytest
        working-directory: engine
        run: uv run pytest -q -m "not gpu and not windows"

      # Lint and type-check don't need the Electron binary, so skip its download.
      - name: npm ci
        working-directory: app
        run: npm ci --ignore-scripts
      - name: lint
        working-directory: app
        run: npm run lint
      - name: type-check
        working-directory: app
        run: npm run typecheck
